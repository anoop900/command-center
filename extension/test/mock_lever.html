<!doctype html><html><head><title>Acme Media - Engineering Manager</title></head><body>
<form id="application-form" method="POST">
<ul>
<li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div>
  <div class="application-field"><input type="file" name="resume" id="resume-upload-input"><span class="resume-upload-filename"></span></div></label></li>
<li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name"></div></label></li>
<li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email"></div></label></li>
<li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
<li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
<li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
<li class="application-question custom-question"><div class="application-label"><div class="text">Are you legally authorized to work in Canada?<span class="required">✱</span></div></div>
  <div class="application-field"><ul><li><label><input type="radio" name="cards[a][field0]" value="Yes" id="lv-a1"><span class="application-answer-alternative">Yes</span></label></li>
  <li><label><input type="radio" name="cards[a][field0]" value="No" id="lv-a2"><span class="application-answer-alternative">No</span></label></li></ul></div></li>
<li class="application-question custom-question"><div class="application-label"><div class="text">Have you ever worked for Acme Media before?</div></div>
  <div class="application-field"><select name="cards[a][field1]" id="lv-w"><option value="">Select...</option><option value="Yes">Yes</option><option value="No">No</option></select></div></li>
<li class="application-question custom-question"><div class="application-label"><div class="text">Why do you want to join Acme?</div></div><div class="application-field"><textarea name="cards[a][field2]" id="lv-why"></textarea></div></li>
<li class="application-question"><label><div class="application-label">Gender</div><div class="application-field"><select name="eeo[gender]" id="lv-g"><option value="">Select ...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div></label></li>
</ul>
<button type="submit" id="submit">Submit application</button>
</form>
<script>window.clicked=[];document.getElementById('submit').onclick=e=>{e.preventDefault();clicked.push('submit')};</script>
</body></html>
